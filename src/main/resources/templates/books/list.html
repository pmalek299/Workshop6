<!DOCTYPE html>

<html>

<head>
  <title>Books admin</title>
</head>

<body>
<h1>Books administration</h1>


<table border=1>
  <thead>
  <tr>
    <th>ID</th>
    <th>Title</th>
    <th>Author</th>
    <th>ISBN</th>
    <th>Publisher</th>
    <th>Type</th>
  </tr>
  </thead>

  <tbody>
    <tr th:each="book : ${books}">
      <td th:text="${book.id}"></td>
      <td th:text="${book.title}"></td>
      <td th:text="${book.author}"></td>
      <td th:text="${book.isbn}"></td>
      <td th:text="${book.publisher}"></td>
      <td th:text="${book.type}"></td>
    </tr>
  </tbody>


</table>

</body>

</html>
